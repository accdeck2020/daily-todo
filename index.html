<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Daily To-Do</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAF6EA">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23FAF6EA'/%3E%3Crect x='14' y='8' width='6' height='84' fill='%23C41E3A'/%3E%3Cline x1='30' y1='30' x2='90' y2='30' stroke='%23C9D3DC' stroke-width='3'/%3E%3Cline x1='30' y1='50' x2='90' y2='50' stroke='%23C9D3DC' stroke-width='3'/%3E%3Cline x1='30' y1='70' x2='90' y2='70' stroke='%23C9D3DC' stroke-width='3'/%3E%3Ccircle cx='30' cy='30' r='6' fill='none' stroke='%232B2A28' stroke-width='3'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23FAF6EA'/%3E%3Crect x='14' y='8' width='6' height='84' fill='%23C41E3A'/%3E%3Cline x1='30' y1='30' x2='90' y2='30' stroke='%23C9D3DC' stroke-width='3'/%3E%3Cline x1='30' y1='50' x2='90' y2='50' stroke='%23C9D3DC' stroke-width='3'/%3E%3Cline x1='30' y1='70' x2='90' y2='70' stroke='%23C9D3DC' stroke-width='3'/%3E%3Ccircle cx='30' cy='30' r='6' fill='none' stroke='%232B2A28' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FAF6EA; --paper-line:#CBD5DE; --margin-red:#C64B54; --ink:#2B2A28;
    --ink-soft:#6B6660; --pen:#B4232F; --pen-dark:#8C1A24; --done:#A6A198;
    --card:#FFFDF7; --border:#E4DCC8;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Inter',system-ui,sans-serif; min-height:100vh; padding-bottom:110px; }
  .page{ max-width:640px; margin:0 auto; position:relative; padding:18px 18px 18px 34px;
    background-image: repeating-linear-gradient(var(--paper) 0px, var(--paper) 37px, var(--paper-line) 38px);
    min-height:100vh; }
  .page::before{ content:""; position:absolute; left:22px; top:0; bottom:0; width:2px; background:var(--margin-red); opacity:0.55; }
  header{ display:flex; align-items:center; justify-content:space-between; padding:6px 0 14px 0; gap:10px; }
  .datebox{ display:flex; align-items:center; gap:12px; }
  .dateicon{ background:var(--card); border:1.5px solid var(--border); border-radius:10px; padding:6px 12px; text-align:center; min-width:64px; }
  .dateicon .mon{font-size:11px; letter-spacing:1px; color:var(--pen); font-weight:600;}
  .dateicon .day{font-size:22px; font-weight:700; color:var(--pen-dark); font-family:'Kalam',cursive; line-height:1.1;}
  .datetext{font-family:'Kalam',cursive;}
  .datetext .wk{font-size:20px; font-weight:700;}
  .datetext .yr{font-size:12px; color:var(--ink-soft);}
  .navbtns{display:flex; gap:6px;}
  .navbtns button{ background:var(--card); border:1.5px solid var(--border); border-radius:8px; width:32px; height:32px; font-size:15px; color:var(--ink); cursor:pointer; }
  .todaybtn{ font-size:11px; border:1.5px solid var(--border); background:var(--card); border-radius:8px; padding:5px 9px; color:var(--ink-soft); cursor:pointer; }
  .syncrow{ display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11.5px; color:var(--ink-soft); margin:-8px 2px 12px 0; }
  .syncrow button{ font-size:11px; border:1px solid var(--border); background:var(--card); border-radius:6px; padding:3px 8px; color:var(--pen-dark); cursor:pointer; }
  .setup{ background:var(--card); border:1.5px solid var(--border); border-radius:12px; padding:16px; margin:10px 0 20px 0; }
  .setup h3{ font-family:'Kalam',cursive; margin:0 0 6px 0; font-size:18px; color:var(--pen-dark); }
  .setup p{ font-size:13px; color:var(--ink-soft); line-height:1.5; margin:0 0 10px 0; }
  .setup input{ width:100%; font-size:14px; padding:9px 10px; border:1.5px solid var(--border); border-radius:8px; margin-bottom:8px; background:#fff; color:var(--ink); }
  .setup button{ background:var(--pen); color:#fff; border:none; border-radius:8px; padding:9px 14px; font-size:13px; cursor:pointer; }

  .maintask{ margin:18px 0; }
  .mt-row{ display:flex; align-items:flex-start; gap:9px; }
  .bullet{ flex:0 0 auto; width:22px; height:22px; margin-top:2px; border-radius:50%; border:2.5px solid var(--pen);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--card); }
  .maintask.done .bullet{ border-color:var(--done); background:var(--done); }
  .bullet svg{width:13px; height:13px; opacity:0; stroke:var(--card); stroke-width:3; fill:none;}
  .maintask.done .bullet svg{opacity:1;}
  .mt-text-wrap{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .mt-label{ align-self:flex-start; font-size:11px; font-family:'Inter',sans-serif; background:var(--card); border:1px solid var(--pen); color:var(--pen-dark);
    border-radius:10px; padding:1px 8px; cursor:pointer; }
  .mt-text{ font-family:'Kalam',cursive; font-size:20px; font-weight:700; color:var(--pen-dark); outline:none;
    white-space:normal; word-break:break-word; line-height:1.3; border-bottom:2px solid transparent; }
  .mt-text:focus{ border-bottom:2px solid var(--pen); }
  .maintask.done .mt-text{ color:var(--done); text-decoration:line-through; text-decoration-thickness:1.5px; }
  .mt-label-toggle{ flex:0 0 auto; background:none; border:none; font-size:15px; cursor:pointer; padding:4px 3px; opacity:0.55; }
  .mt-sub-toggle{ flex:0 0 auto; background:none; border:none; color:var(--ink-soft); font-size:17px; cursor:pointer; padding:4px 3px; opacity:0.7; }
  .mt-del{ flex:0 0 auto; background:none; border:none; color:var(--ink-soft); font-size:16px; cursor:pointer; padding:4px 3px; opacity:0.5; }
  .maintask.targeted .mt-row{ background:var(--card); border-radius:8px; box-shadow:inset 0 0 0 1.5px var(--pen); }

  ul.tinytasks{list-style:none; margin:6px 0 4px 27px; padding:0 0 0 12px; border-left:2px solid var(--border);}
  li.tinytask{ display:flex; align-items:flex-start; gap:8px; padding:5px 2px; }
  .tt-bullet{ flex:0 0 auto; width:16px; height:16px; margin-top:3px; border-radius:50%; border:1.7px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center; cursor:pointer; background:var(--card); }
  li.tinytask.done .tt-bullet{ border-color:var(--done); background:var(--done); }
  .tt-bullet svg{width:9px; height:9px; opacity:0; stroke:var(--card); stroke-width:3; fill:none;}
  li.tinytask.done .tt-bullet svg{opacity:1;}
  .tt-text{ flex:1; font-size:15px; line-height:1.4; padding-top:1px; color:var(--ink); outline:none; }
  li.tinytask.done .tt-text{ color:var(--done); text-decoration:line-through; text-decoration-thickness:1.5px; }
  .tt-del{ flex:0 0 auto; background:none; border:none; color:var(--ink-soft); font-size:13px; cursor:pointer; padding:0 3px; opacity:0.5; }

  .tt-add-row{ display:flex; align-items:center; gap:8px; margin:2px 0 8px 27px; padding-left:12px; border-left:2px solid var(--pen); }
  .tt-add-row input{ flex:1; font-size:14px; border:none; border-bottom:1.5px dashed var(--border); background:transparent; padding:5px 2px; outline:none; color:var(--ink); }
  .tt-add-row .hint{ font-size:11.5px; color:var(--pen-dark); white-space:nowrap; }

  .empty-hint{ font-size:13px; color:var(--ink-soft); font-style:italic; padding:24px 2px; text-align:center; }

  .dock{ position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; gap:14px;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(to top, var(--paper) 60%, rgba(250,246,234,0)); }
  .textadd{ flex:1; max-width:420px; background:var(--card); border:1.5px solid var(--border); border-radius:22px; padding:11px 16px; font-size:15px; font-family:'Inter',sans-serif; outline:none; color:var(--ink); }
  .mic{ flex:0 0 auto; width:54px; height:54px; border-radius:50%; background:var(--pen); border:none; color:#fff; font-size:22px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 3px 10px rgba(140,26,36,0.35); }
  .mic.listening{ background:var(--pen-dark); animation:pulse 1.1s infinite; }
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(140,26,36,0.45);} 70%{box-shadow:0 0 0 16px rgba(140,26,36,0);} 100%{box-shadow:0 0 0 0 rgba(140,26,36,0);} }
  .voice-status{ position:fixed; left:0; right:0; bottom:88px; text-align:center; font-family:'Kalam',cursive; font-size:15px; color:var(--pen-dark); pointer-events:none; }
  .toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:96px; background:var(--ink); color:var(--paper); font-size:13px;
    padding:8px 14px; border-radius:20px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:80%; text-align:center; }
  .toast.show{opacity:0.92;}
</style>
</head>
<body>
<div class="page" id="page">
  <header>
    <div class="datebox">
      <div class="dateicon"><div class="mon" id="mon">AUG</div><div class="day" id="day">29</div></div>
      <div class="datetext"><div class="wk" id="weekday">Saturday</div><div class="yr" id="year">2026</div></div>
    </div>
    <div class="navbtns">
      <button id="prevDay" aria-label="Previous day">‹</button>
      <button class="todaybtn" id="todayBtn">Today</button>
      <button id="nextDay" aria-label="Next day">›</button>
    </div>
  </header>
  <div class="syncrow">
    <span id="syncStatus">Checking sync…</span>
    <button id="syncActionBtn" style="display:none;"></button>
  </div>

  <div class="setup" id="setupPanel" style="display:none;">
    <h3>Connect Google Drive</h3>
    <p id="setupText">Paste the OAuth Client ID you created in Google Cloud Console, then sign in. This is done once per device.</p>
    <input id="clientIdInput" placeholder="xxxxxxxxxx.apps.googleusercontent.com" />
    <button id="saveClientIdBtn">Save and continue</button>
  </div>

  <div id="mainTasks"></div>
</div>

<div class="voice-status" id="voiceStatus"></div>
<div class="toast" id="toast"></div>

<div class="dock">
  <input class="textadd" id="textAdd" placeholder="Type a main task, or tap the mic">
  <button class="mic" id="micBtn" aria-label="Add task by voice">🎤</button>
</div>

<script>
(function(){
  var GDRIVE_FILE_NAME = "diary-todo-sync.json";
  var GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
  var state = { date: todayStr(), data: null, activeTarget: null };
  var drive = { clientId:null, accessToken:null, fileId:null, signedIn:false };
  var blob = null;
  var pushTimer = null;

  function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function pad(n){ return n<10 ? "0"+n : ""+n; }
  function uid(){ return Math.random().toString(36).slice(2,9); }

  function loadLocalCache(){
    try{ var raw = localStorage.getItem("gdrive_blob_cache"); if(raw) return JSON.parse(raw); }catch(e){}
    return { updatedAt:0, kv:{} };
  }
  function saveLocalCache(b){ try{ localStorage.setItem("gdrive_blob_cache", JSON.stringify(b)); }catch(e){} }

  async function storageGet(key){
    if(!blob) blob = loadLocalCache();
    return blob.kv[key] || null;
  }
  async function storageSet(key, value){
    if(!blob) blob = loadLocalCache();
    blob.kv[key] = value;
    blob.updatedAt = Date.now();
    saveLocalCache(blob);
    schedulePush();
  }
  function schedulePush(){
    if(!drive.signedIn) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToDrive, 1000);
  }

  function normalizeDayData(parsed){
    if(!parsed) return null;
    if(Array.isArray(parsed.tasks)) return parsed;
    if(Array.isArray(parsed.categories)){
      var migrated = [];
      parsed.categories.forEach(function(cat){
        (cat.tasks||[]).forEach(function(t){
          migrated.push({
            id: t.id || uid(),
            text: t.text,
            done: !!t.done,
            label: t.label || "",
            subtasks: (t.subtasks||[]).map(function(st){ return {id: st.id || uid(), text: st.text, done: !!st.done}; })
          });
        });
      });
      return { tasks: migrated };
    }
    return { tasks: [] };
  }

  async function loadDay(dateStr){
    var raw = await storageGet("diary:"+dateStr);
    if(raw){
      try{ return normalizeDayData(JSON.parse(raw)); }catch(e){}
    }
    var prior = await findMostRecentPriorDay(dateStr, 30);
    var tasks = [];
    if(prior && prior.tasks){
      prior.tasks.forEach(function(t){
        if(!t.done){
          tasks.push({
            id: uid(), text: t.text, done:false, label: t.label || "",
            subtasks: (t.subtasks||[]).map(function(st){ return {id:uid(), text:st.text, done:st.done}; })
          });
        }
      });
    }
    return { tasks: tasks };
  }
  async function saveDay(dateStr, data){ await storageSet("diary:"+dateStr, JSON.stringify(data)); }
  async function findMostRecentPriorDay(dateStr, maxLookback){
    var d = parseDate(dateStr);
    for(var i=1; i<=maxLookback; i++){
      var prev = new Date(d.getTime());
      prev.setDate(prev.getDate()-i);
      var prevStr = prev.getFullYear()+"-"+pad(prev.getMonth()+1)+"-"+pad(prev.getDate());
      var raw = await storageGet("diary:"+prevStr);
      if(raw){ try{ return normalizeDayData(JSON.parse(raw)); }catch(e){} }
    }
    return null;
  }

  function setSyncStatus(text, actionLabel, actionFn){
    document.getElementById("syncStatus").textContent = text;
    var btn = document.getElementById("syncActionBtn");
    if(actionLabel){ btn.style.display="inline-block"; btn.textContent = actionLabel; btn.onclick = actionFn; }
    else { btn.style.display="none"; }
  }
  function showSetupPanel(text){
    document.getElementById("setupPanel").style.display = "block";
    if(text) document.getElementById("setupText").textContent = text;
  }
  function hideSetupPanel(){ document.getElementById("setupPanel").style.display = "none"; }

  function saveStoredToken(token, expiresInSeconds){
    try{
      var expiresAt = Date.now() + (parseInt(expiresInSeconds||"3600",10) * 1000);
      localStorage.setItem("gdrive_token", JSON.stringify({ token: token, expiresAt: expiresAt }));
    }catch(e){}
  }
  function loadStoredToken(){
    try{
      var raw = localStorage.getItem("gdrive_token");
      if(!raw) return null;
      var obj = JSON.parse(raw);
      if(obj && obj.token && obj.expiresAt && (obj.expiresAt - Date.now() > 60000)){ return obj.token; }
    }catch(e){}
    return null;
  }
  function clearStoredToken(){ try{ localStorage.removeItem("gdrive_token"); }catch(e){} }

  async function driveFetch(url, opts){
    opts = opts || {};
    opts.headers = opts.headers || {};
    opts.headers["Authorization"] = "Bearer " + drive.accessToken;
    var res = await fetch(url, opts);
    if(res.status === 401){
      clearStoredToken();
      drive.signedIn = false; drive.accessToken = null;
      setSyncStatus("Signed out (session expired)", "Sign in with Google", function(){
        setSyncStatus("Opening Google sign-in…");
        connectDrive(false);
      });
      throw new Error("Drive API 401: token expired or revoked");
    }
    if(!res.ok){ var t = await res.text(); throw new Error("Drive API "+res.status+": "+t); }
    return res;
  }

  async function findOrCreateDriveFile(){
    var q = encodeURIComponent("name='"+GDRIVE_FILE_NAME+"' and trashed=false");
    var res = await driveFetch("https://www.googleapis.com/drive/v3/files?q="+q+"&fields=files(id,name)&spaces=drive");
    var json = await res.json();
    if(json.files && json.files.length){ return json.files[0].id; }
    var metadata = { name: GDRIVE_FILE_NAME, mimeType: "application/json" };
    var boundary = "-------diarytodo" + Date.now();
    var body =
      "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(metadata)+"\r\n"+
      "--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify({updatedAt:0, kv:{}})+"\r\n"+
      "--"+boundary+"--";
    var createRes = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
      method:"POST", headers:{ "Content-Type":"multipart/related; boundary="+boundary }, body: body
    });
    var createJson = await createRes.json();
    return createJson.id;
  }

  async function pullFromDrive(){
    var res = await driveFetch("https://www.googleapis.com/drive/v3/files/"+drive.fileId+"?alt=media");
    var remote = await res.json();
    var local = blob || loadLocalCache();
    blob = (remote.updatedAt||0) >= (local.updatedAt||0) ? remote : local;
    saveLocalCache(blob);
  }
  async function pushToDrive(){
    if(!drive.signedIn || !drive.fileId || !blob) return;
    try{
      await driveFetch("https://www.googleapis.com/upload/drive/v3/files/"+drive.fileId+"?uploadType=media", {
        method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(blob)
      });
      setSyncStatus("Synced just now via Google Drive");
    }catch(e){
      setSyncStatus("Couldn't reach Drive — saved on this device");
    }
  }

  async function connectDrive(silent){
    if(silent) return false;
    var redirectUri = window.location.origin + window.location.pathname;
    var params = new URLSearchParams({
      client_id: drive.clientId, redirect_uri: redirectUri, response_type: "token",
      scope: GDRIVE_SCOPE, include_granted_scopes: "true", prompt: "consent"
    });
    window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();
    return new Promise(function(){});
  }

  function parseTokenFromHash(){
    if(location.hash && location.hash.indexOf("access_token") !== -1){
      var params = new URLSearchParams(location.hash.substring(1));
      var token = params.get("access_token");
      var expiresIn = params.get("expires_in");
      history.replaceState(null, "", location.pathname + location.search);
      if(token){
        drive.accessToken = token; drive.signedIn = true;
        saveStoredToken(token, expiresIn);
        return true;
      }
    }
    if(location.hash && location.hash.indexOf("error=") !== -1){
      history.replaceState(null, "", location.pathname + location.search);
      showToast("Google sign-in was cancelled");
    }
    return false;
  }

  async function initDriveSync(){
    var savedId = null;
    try{ savedId = localStorage.getItem("gdrive_client_id"); }catch(e){}
    if(!savedId){ showSetupPanel(); setSyncStatus("Not connected to Drive"); return; }
    drive.clientId = savedId;
    if(parseTokenFromHash()){ await finishDriveConnect(); return; }
    var stored = loadStoredToken();
    if(stored){ drive.accessToken = stored; drive.signedIn = true; await finishDriveConnect(); return; }
    function offerSignIn(){
      setSyncStatus("Not signed in", "Sign in with Google", function(){
        setSyncStatus("Opening Google sign-in…");
        connectDrive(false);
      });
    }
    offerSignIn();
  }

  async function finishDriveConnect(){
    hideSetupPanel();
    setSyncStatus("Syncing…");
    try{
      drive.fileId = await findOrCreateDriveFile();
      await pullFromDrive();
      setSyncStatus("Synced via Google Drive", "Refresh", async function(){
        setSyncStatus("Refreshing…");
        await pullFromDrive();
        await loadAndRender();
        setSyncStatus("Synced via Google Drive");
      });
      await loadAndRender();
    }catch(e){
      setSyncStatus("Drive error — using local copy");
    }
  }

  document.getElementById("saveClientIdBtn").addEventListener("click", async function(){
    var val = document.getElementById("clientIdInput").value.trim();
    if(!val){ return; }
    try{ localStorage.setItem("gdrive_client_id", val); }catch(e){}
    await initDriveSync();
  });

  window.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && drive.signedIn && drive.fileId){
      pullFromDrive().then(loadAndRender);
    }
  });

  function renderDateHeader(){
    var d = parseDate(state.date);
    var months = ["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
    var weekdays = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
    document.getElementById("mon").textContent = months[d.getMonth()];
    document.getElementById("day").textContent = d.getDate();
    document.getElementById("weekday").textContent = weekdays[d.getDay()];
    document.getElementById("year").textContent = d.getFullYear();
  }
  function parseDate(s){ var p = s.split("-"); return new Date(parseInt(p[0]),parseInt(p[1])-1,parseInt(p[2])); }
  function shiftDay(delta){
    var d = parseDate(state.date); d.setDate(d.getDate()+delta);
    state.date = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
    loadAndRender();
  }

  async function loadAndRender(){
    state.data = await loadDay(state.date);
    renderDateHeader();
    renderMainTasks();
  }

  function renderMainTasks(){
    var wrap = document.getElementById("mainTasks");
    wrap.innerHTML = "";
    if(!state.data.tasks.length){
      var hint = document.createElement("div"); hint.className = "empty-hint";
      hint.textContent = "No tasks yet — type one below or tap the mic";
      wrap.appendChild(hint);
      return;
    }
    state.data.tasks.forEach(function(t){
      if(!t.subtasks) t.subtasks = [];
      var isTargeted = state.activeTarget === t.id;
      var box = document.createElement("div");
      box.className = "maintask" + (t.done? " done":"") + (isTargeted? " targeted":"");

      var row = document.createElement("div"); row.className = "mt-row";
      var bullet = document.createElement("div"); bullet.className = "bullet";
      bullet.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>';
      bullet.addEventListener("click", function(){ t.done = !t.done; persist(); renderMainTasks(); });

      var txtWrap = document.createElement("div"); txtWrap.className = "mt-text-wrap";
      if(t.label){
        var pill = document.createElement("span"); pill.className = "mt-label"; pill.textContent = t.label; pill.title = "Tap to edit label";
        pill.addEventListener("click", function(){
          var val = prompt("Label for this task (leave blank to remove):", t.label || "");
          if(val === null) return;
          t.label = val.trim(); persist(); renderMainTasks();
        });
        txtWrap.appendChild(pill);
      }
      var txt = document.createElement("div"); txt.className = "mt-text"; txt.contentEditable = "true"; txt.spellcheck = false; txt.textContent = t.text;
      txt.addEventListener("blur", function(){
        var v = txt.textContent.trim(); t.text = v || t.text; txt.textContent = t.text; persist();
      });
      txt.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); txt.blur(); } });
      txtWrap.appendChild(txt);

      var labelBtn = document.createElement("button"); labelBtn.className = "mt-label-toggle"; labelBtn.title = "Add label"; labelBtn.textContent = "🏷";
      labelBtn.addEventListener("click", function(){
        var val = prompt("Label for this task (leave blank to remove):", t.label || "");
        if(val === null) return;
        t.label = val.trim(); persist(); renderMainTasks();
      });
      var subToggle = document.createElement("button"); subToggle.className = "mt-sub-toggle"; subToggle.title = "Add tiny task"; subToggle.textContent = "+";
      subToggle.addEventListener("click", function(){
        state.activeTarget = isTargeted ? null : t.id;
        renderMainTasks();
      });
      var del = document.createElement("button"); del.className = "mt-del"; del.textContent = "✕";
      del.addEventListener("click", function(){
        state.data.tasks = state.data.tasks.filter(function(x){return x.id!==t.id;});
        if(isTargeted) state.activeTarget = null;
        persist(); renderMainTasks();
      });
      row.appendChild(bullet); row.appendChild(txtWrap); row.appendChild(labelBtn); row.appendChild(subToggle); row.appendChild(del);
      box.appendChild(row);

      if(t.subtasks.length){
        var ul = document.createElement("ul"); ul.className = "tinytasks";
        t.subtasks.forEach(function(st){
          var li = document.createElement("li"); li.className = "tinytask" + (st.done? " done":"");
          var sb = document.createElement("div"); sb.className = "tt-bullet";
          sb.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4,13 9,18 20,6"/></svg>';
          sb.addEventListener("click", function(){ st.done = !st.done; persist(); renderMainTasks(); });
          var stxt = document.createElement("div"); stxt.className = "tt-text"; stxt.contentEditable = "true"; stxt.spellcheck = false; stxt.textContent = st.text;
          stxt.addEventListener("blur", function(){ var v = stxt.textContent.trim(); st.text = v || st.text; stxt.textContent = st.text; persist(); });
          stxt.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); stxt.blur(); } });
          var sdel = document.createElement("button"); sdel.className = "tt-del"; sdel.textContent = "✕";
          sdel.addEventListener("click", function(){
            t.subtasks = t.subtasks.filter(function(x){return x.id!==st.id;});
            persist(); renderMainTasks();
          });
          li.appendChild(sb); li.appendChild(stxt); li.appendChild(sdel);
          ul.appendChild(li);
        });
        box.appendChild(ul);
      }

      if(isTargeted){
        var addRow = document.createElement("div"); addRow.className = "tt-add-row";
        var addInput = document.createElement("input");
        addInput.placeholder = "Type a tiny task, or speak it"; addInput.autofocus = true;
        addInput.addEventListener("keydown", function(e){
          if(e.key==="Enter"){ var v = e.target.value.trim(); if(v){ addTinyTask(t, v); e.target.value=""; } }
        });
        var hintEl = document.createElement("span"); hintEl.className = "hint"; hintEl.textContent = "mic adds here";
        addRow.appendChild(addInput); addRow.appendChild(hintEl);
        box.appendChild(addRow);
      }

      wrap.appendChild(box);
    });
  }

  async function persist(){ await saveDay(state.date, state.data); }

  function addTinyTask(mainTask, text){
    if(!text || !text.trim()) return;
    if(!mainTask.subtasks) mainTask.subtasks = [];
    mainTask.subtasks.push({id:uid(), text:text.trim(), done:false});
    persist(); renderMainTasks();
    showToast('Added to "'+mainTask.text+'"');
  }
  function addMainTask(text){
    if(!text || !text.trim()) return;
    state.data.tasks.push({id:uid(), text:text.trim(), done:false, label:"", subtasks:[]});
    persist(); renderMainTasks();
    showToast('Main task added');
  }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  function handleParsedSpeech(raw){
    var text = raw.trim();
    if(!text) return;
    if(state.activeTarget){
      var target = state.data.tasks.find(function(x){return x.id===state.activeTarget;});
      if(target){ addTinyTask(target, text); return; }
      state.activeTarget = null;
    }
    addMainTask(text);
  }

  document.getElementById("prevDay").addEventListener("click", function(){ shiftDay(-1); });
  document.getElementById("nextDay").addEventListener("click", function(){ shiftDay(1); });
  document.getElementById("todayBtn").addEventListener("click", function(){ state.date = todayStr(); loadAndRender(); });
  document.getElementById("textAdd").addEventListener("keydown", function(e){
    if(e.key==="Enter"){ var val = e.target.value; e.target.value = ""; handleParsedSpeech(val); }
  });

  var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  var micBtn = document.getElementById("micBtn");
  var voiceStatus = document.getElementById("voiceStatus");
  if(SpeechRec){
    var rec = new SpeechRec();
    rec.lang = "en-IN"; rec.interimResults = true; rec.maxAlternatives = 1;
    var listening = false;
    rec.onstart = function(){ listening = true; micBtn.classList.add("listening"); voiceStatus.textContent = "Listening…"; };
    rec.onresult = function(e){
      var text = ""; for(var i=0;i<e.results.length;i++){ text += e.results[i][0].transcript; }
      voiceStatus.textContent = text;
    };
    rec.onerror = function(){ voiceStatus.textContent = ""; showToast("Couldn't hear that — try again"); };
    rec.onend = function(){
      listening = false; micBtn.classList.remove("listening");
      var finalText = voiceStatus.textContent; voiceStatus.textContent = "";
      if(finalText) handleParsedSpeech(finalText);
    };
    micBtn.addEventListener("click", function(){
      if(listening){ rec.stop(); return; }
      try{ rec.start(); }catch(err){}
    });
  } else {
    micBtn.addEventListener("click", function(){ showToast("Voice input isn't supported in this browser — try Chrome"); });
  }

  (async function boot(){
    try{
      blob = loadLocalCache();
      await loadAndRender();
      setTimeout(initDriveSync, 300);
    }catch(e){
      document.getElementById("syncStatus").textContent = "Something went wrong loading today — try reloading";
      var hint = document.createElement("div");
      hint.style.cssText = "font-size:11px;color:var(--ink-soft);margin:4px 2px;";
      hint.textContent = String(e && e.message || e);
      document.getElementById("mainTasks").before(hint);
    }
  })();
})();
</script>
</body>
</html>
