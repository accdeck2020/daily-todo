<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diary To-Do</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f6f0dc;
  --paper-dark:#efe6c8;
  --line:#d9cdaa;
  --margin-red:#c1443c;
  --ink:#2b2a25;
  --ink-soft:#5b5748;
  --accent:#c1443c;
  --accent-dark:#9c332c;
  --chip:#e7dcb8;
  --done:#9a9382;
  --shadow: 0 2px 10px rgba(0,0,0,.12);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:#3a352b;
  color:var(--ink);
  font-family:'Patrick Hand','Kalam',cursive,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
}
#app{
  width:100%;
  max-width:640px;
  min-height:100vh;
  background:var(--paper);
  position:relative;
  display:flex;
  flex-direction:column;
  box-shadow: var(--shadow);
}
/* ---------- header ---------- */
.app-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 14px 10px 14px;
  background:var(--paper-dark);
  border-bottom:2px solid var(--line);
}
.icon-round-btn{
  background:none;border:none;font-size:22px;cursor:pointer;color:var(--ink);
  width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.icon-round-btn:active{background:rgba(0,0,0,.08);}
.date-nav{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.nav-arrow{background:none;border:none;font-size:22px;color:var(--accent);cursor:pointer;padding:4px 8px;}
.date-box{
  background:var(--accent);
  color:#fff;
  border-radius:8px;
  width:54px;
  text-align:center;
  padding:4px 2px;
  font-family:'Kalam',cursive;
  line-height:1.05;
  box-shadow: 0 2px 4px rgba(0,0,0,.2);
}
.date-box .dnum{font-size:22px;font-weight:700;}
.date-box .dmon{font-size:11px;letter-spacing:1px;}
.date-info{text-align:left;}
.date-info .weekday{font-family:'Kalam',cursive;font-size:17px;font-weight:700;}
.date-info .year{font-size:13px;color:var(--ink-soft);}
.today-btn{
  background:none;border:1.5px solid var(--accent);color:var(--accent);
  border-radius:14px;font-size:12px;padding:3px 9px;cursor:pointer;font-family:inherit;
}
.today-btn.active{background:var(--accent);color:#fff;}

/* ---------- filter bar ---------- */
.filter-bar{
  display:flex;align-items:center;gap:8px;
  padding:8px 16px;background:var(--paper);
  border-bottom:1px solid var(--line);
}
.filter-bar label{font-size:13px;color:var(--ink-soft);}
.filter-bar select{
  flex:1;font-family:inherit;font-size:14px;padding:5px 8px;border-radius:6px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
}
#syncStatus{font-size:12px;color:var(--ink-soft);white-space:nowrap;}
#syncStatus button{
  background:none;border:1px solid var(--accent);color:var(--accent);border-radius:10px;
  padding:3px 8px;font-size:11px;cursor:pointer;font-family:inherit;
}

/* ---------- task list / ruled paper ---------- */
.task-list{
  flex:1;
  position:relative;
  padding:6px 14px 90px 30px;
  background-image: repeating-linear-gradient(var(--paper) 0 43px, var(--line) 43px 44px);
  background-position: 0 4px;
}
.task-list::before{
  content:"";
  position:absolute;
  left:20px;top:0;bottom:0;width:2px;
  background:var(--margin-red);
  opacity:.55;
}
.empty-state{
  text-align:center;color:var(--ink-soft);padding:40px 10px;font-size:16px;
}
.main-task{
  position:relative;
  margin:10px 0 14px 0;
  padding-bottom:4px;
}
.mt-row{
  display:flex;align-items:flex-start;gap:8px;
}
.mt-check{
  width:20px;height:20px;margin-top:6px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;
}
.mt-text{
  flex:1;font-size:19px;line-height:1.35;padding:4px 2px;outline:none;
  border-radius:4px;
  word-break:break-word;
}
.mt-text:focus{background:rgba(255,255,255,.6);}
.main-task.done .mt-text{ text-decoration:line-through; color:var(--done); }
.mt-actions{
  display:flex;align-items:center;gap:0;flex-shrink:0;flex-wrap:nowrap;justify-content:flex-end;
}
.icon-btn{
  background:none;border:none;font-size:13px;cursor:pointer;color:var(--ink-soft);
  padding:4px 3px;border-radius:6px;position:relative;font-family:inherit;
}
.icon-btn:active{background:rgba(0,0,0,.08);}
.pri-btn{font-weight:700;color:var(--accent);}
.badge{
  position:absolute;top:-2px;right:-2px;background:var(--accent);color:#fff;
  font-size:9px;border-radius:50%;min-width:14px;height:14px;line-height:14px;text-align:center;padding:0 2px;
}
.mt-label-chip{
  display:inline-block;margin:2px 0 4px 28px;background:var(--chip);color:var(--ink-soft);
  font-size:12px;padding:2px 8px;border-radius:10px;
}
.mt-label-chip.small{font-size:11px;margin:0 0 0 6px;}
.tiny-list{margin-left:28px;}
.tiny-task{
  display:flex;align-items:center;gap:7px;padding:3px 0;
}
.tt-check{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;flex-shrink:0;}
.tt-text{flex:1;font-size:15.5px;outline:none;padding:2px;border-radius:4px;word-break:break-word;}
.tt-text:focus{background:rgba(255,255,255,.6);}
.tiny-task.done .tt-text{text-decoration:line-through;color:var(--done);}
.tt-pri-btn{font-size:12px;color:var(--accent);font-weight:700;background:none;border:none;cursor:pointer;padding:2px 5px;}
.tt-del-btn{background:none;border:none;color:var(--ink-soft);font-size:12px;cursor:pointer;padding:2px 5px;}
.tiny-add-row{
  margin:4px 0 0 28px;font-size:13px;color:var(--accent-dark);
  background:#fff8e6;border:1px dashed var(--accent);border-radius:6px;padding:5px 8px;
  display:flex;justify-content:space-between;align-items:center;
}
.tiny-add-row button{background:none;border:none;color:var(--accent-dark);font-size:15px;cursor:pointer;}

/* ---------- input bar ---------- */
.input-bar{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:640px;
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;
  background:var(--paper-dark);border-top:2px solid var(--line);
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
}
#textInput{
  flex:1;font-family:inherit;font-size:16px;padding:10px 12px;border-radius:20px;
  border:1px solid var(--line);background:#fff;color:var(--ink);
}
.mic-btn{
  width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;border:none;
  font-size:20px;cursor:pointer;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.25);
}
.mic-btn.listening{animation:pulse 1s infinite;background:var(--accent-dark);}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(193,68,60,.5);}70%{box-shadow:0 0 0 12px rgba(193,68,60,0);}100%{box-shadow:0 0 0 0 rgba(193,68,60,0);}}

/* ---------- side panel ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40;
}
.overlay.open{opacity:1;pointer-events:auto;}
.side-panel{
  position:fixed;top:0;left:0;bottom:0;width:86%;max-width:360px;
  background:var(--paper);z-index:41;transform:translateX(-100%);transition:transform .25s;
  display:flex;flex-direction:column;box-shadow:2px 0 12px rgba(0,0,0,.3);
}
.side-panel.open{transform:translateX(0);}
.panel-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px;background:var(--paper-dark);border-bottom:2px solid var(--line);
}
.panel-header h2{margin:0;font-family:'Kalam',cursive;font-size:20px;}
.menu-nav{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;border-bottom:1px solid var(--line);}
.menu-nav button{
  font-family:inherit;font-size:13px;padding:6px 10px;border-radius:14px;border:1px solid var(--line);
  background:#fff;cursor:pointer;color:var(--ink-soft);
}
.menu-nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.menu-body{flex:1;overflow-y:auto;padding:12px 14px;}
.menu-body input[type=text]{
  width:100%;font-family:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin-bottom:10px;
}
.search-result{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:8px 10px;margin-bottom:6px;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink);
}
.sr-date{float:right;color:var(--ink-soft);font-size:12px;}
.hist-row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:14px;}
.hist-time{color:var(--ink-soft);font-size:11px;}
.del-tiny{font-size:12px;color:var(--ink-soft);}
.del-time{font-size:11px;color:var(--ink-soft);}
.empty{color:var(--ink-soft);font-size:14px;}
.label-row{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin-bottom:6px;}
.label-row span{flex:1;font-size:15px;}
.label-row button{font-family:inherit;font-size:12px;padding:4px 8px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;}

/* ---------- bottom sheet ---------- */
.sheet-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;
  display:flex;align-items:flex-end;justify-content:center;
}
.sheet-overlay.open{opacity:1;pointer-events:auto;}
.sheet{
  width:100%;max-width:640px;background:var(--paper);border-radius:16px 16px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom)) 18px;
  transform:translateY(100%);transition:transform .25s;
  max-height:70vh;overflow-y:auto;
}
.sheet-overlay.open .sheet{transform:translateY(0);}
.sheet h3{margin:0 0 10px 0;font-family:'Kalam',cursive;font-size:19px;}
.sheet-option{
  display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;margin-bottom:6px;font-family:inherit;font-size:15px;cursor:pointer;color:var(--ink);
}
.sheet-option.selected{border-color:var(--accent);background:#fdf1ee;color:var(--accent-dark);font-weight:700;}
.sheet input[type=text],.sheet input[type=number],.sheet input[type=time]{
  font-family:inherit;font-size:16px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);margin-right:8px;margin-bottom:8px;width:100%;
}
.sheet button.primary, #priSaveBtn, #remSaveBtn, #saveNewLabelBtn, #renameLabelSaveBtn{
  background:var(--accent);color:#fff;border:none;border-radius:8px;padding:9px 14px;font-family:inherit;font-size:14px;cursor:pointer;margin-right:6px;
}
.sheet button.secondary, #priClearBtn, #remClearBtn{
  background:none;border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-family:inherit;font-size:14px;cursor:pointer;color:var(--ink-soft);
}

/* ---------- setup panel ---------- */
.setup-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.setup-overlay.open{opacity:1;pointer-events:auto;}
.setup-box{
  background:var(--paper);border-radius:14px;max-width:460px;width:100%;padding:20px;max-height:88vh;overflow-y:auto;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}
.setup-box h2{font-family:'Kalam',cursive;margin-top:0;}
.setup-box label{font-size:13px;color:var(--ink-soft);display:block;margin-top:10px;}
.setup-box input[type=text]{width:100%;font-family:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:1px solid var(--line);margin-top:4px;}
.setup-box .row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
.setup-box button{font-family:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:none;cursor:pointer;}
.setup-box .btn-primary{background:var(--accent);color:#fff;}
.setup-box .btn-secondary{background:#fff;border:1px solid var(--line) !important;color:var(--ink);}
.setup-box .uri-box{
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12.5px;
  word-break:break-all;font-family:monospace;flex:1;
}
.setup-box .status-line{margin-top:12px;font-size:14px;font-weight:700;}
.setup-box .close-x{float:right;background:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}
.setup-box ol{font-size:13.5px;color:var(--ink-soft);padding-left:20px;}
.setup-box ol li{margin-bottom:6px;}

/* ---------- toast ---------- */
#toastContainer{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:6px;align-items:center;width:100%;max-width:600px;pointer-events:none;}
.toast{
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;
  opacity:0;transform:translateY(-10px);transition:opacity .25s, transform .25s;box-shadow:0 4px 12px rgba(0,0,0,.3);
  font-family:'Patrick Hand',sans-serif;
}
.toast.show{opacity:1;transform:translateY(0);}
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <button id="menuBtn" class="icon-round-btn" aria-label="Menu">&#9776;</button>
    <div class="date-nav">
      <button id="prevDayBtn" class="nav-arrow" aria-label="Previous day">&#8249;</button>
      <div class="date-box"><div class="dnum" id="dateNum">1</div><div class="dmon" id="dateMon">JAN</div></div>
      <div class="date-info">
        <div class="weekday" id="weekdayLbl">Day</div>
        <div class="year" id="yearLbl">2026</div>
      </div>
      <button id="todayBtn" class="today-btn">Today</button>
      <button id="nextDayBtn" class="nav-arrow" aria-label="Next day">&#8250;</button>
    </div>
    <button id="setupOpenBtn" class="icon-round-btn" aria-label="Sync settings" title="Sync settings">&#9729;</button>
  </header>

  <div class="filter-bar">
    <label for="labelFilter">Label:</label>
    <select id="labelFilter"><option value="">All</option></select>
    <span id="syncStatus"></span>
  </div>

  <main id="taskList" class="task-list"></main>

  <div class="input-bar">
    <input id="textInput" type="text" placeholder="Add a task or tap mic…" autocomplete="off">
    <button id="micBtn" class="mic-btn" aria-label="Voice input">&#127908;</button>
  </div>
</div>

<div id="overlay" class="overlay"></div>
<div id="sidePanel" class="side-panel">
  <div class="panel-header">
    <h2>Menu</h2>
    <button id="closeMenuBtn" class="icon-round-btn">&times;</button>
  </div>
  <div class="menu-nav">
    <button data-section="search" class="active">Search</button>
    <button data-section="completed">Completed</button>
    <button data-section="deleted">Deleted</button>
    <button data-section="labels">Manage labels</button>
    <button data-section="sync">Sync settings</button>
  </div>
  <div class="menu-body" id="menuBody"></div>
</div>

<div id="sheetOverlay" class="sheet-overlay">
  <div class="sheet">
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
  </div>
</div>

<div id="setupOverlay" class="setup-overlay">
  <div class="setup-box">
    <button class="close-x" id="setupCloseBtn">&times;</button>
    <h2>Sync Settings</h2>
    <p style="font-size:13.5px;color:var(--ink-soft)">One-time per device. Enter the address of your own sync server (running on your PC, reachable over Tailscale) and the secret key it printed when you started it.</p>
    <label for="setupServerUrlInput">Sync server URL</label>
    <input id="setupServerUrlInput" type="text" placeholder="https://your-pc-name.your-tailnet.ts.net">
    <label for="setupSecretKeyInput">Secret key</label>
    <input id="setupSecretKeyInput" type="text" placeholder="paste the key the server printed">
    <div class="row">
      <button id="setupSaveBtn" class="btn-primary">Save &amp; Connect</button>
    </div>
    <div class="row" style="margin-top:14px;">
      <button id="setupSyncNowBtn" class="btn-secondary">Sync now</button>
      <button id="setupDisconnectBtn" class="btn-secondary">Disconnect</button>
    </div>
    <div class="status-line" id="setupStatusLine"></div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
(function(){
"use strict";

/* ================= storage keys ================= */
var K = {
  blob: 'diaryTodo.blob.v1',
  serverUrl: 'diaryTodo.syncServerUrl',
  secretKey: 'diaryTodo.syncSecretKey'
};

/* ================= date helpers ================= */
function pad2(n){ return String(n).padStart(2,'0'); }
function dateKey(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function parseDateKey(k){ var p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ var nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function startOfToday(){ var d=new Date(); d.setHours(0,0,0,0); return d; }

/* ================= id / escape ================= */
function genId(){ return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function escapeAttr(s){ return escapeHtml(s); }

/* ================= state ================= */
var currentDate = startOfToday();
var blob = loadBlobFromCache();
var dirty = false;
var syncBroken = false;
var currentLabelFilter = '';
var openTinyAddFor = null;
var firedReminders = new Set();
var pushTimer = null;
var syncQueue = Promise.resolve();

function loadBlobFromCache(){
  try{
    var raw = localStorage.getItem(K.blob);
    if (raw){ var parsed = JSON.parse(raw); if (parsed && typeof parsed==='object' && parsed.data) return parsed; }
  }catch(e){}
  return { updatedAt: 0, data: {} };
}
function persistLocalCache(){
  try{ localStorage.setItem(K.blob, JSON.stringify(blob)); }catch(e){}
}
function markDirty(){
  dirty = true;
  blob.updatedAt = Date.now();
  persistLocalCache();
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function(){ pushNow(); }, 380);
}

/* ================= day / data access ================= */
function dayKeyOf(k){ return 'diary:'+k; }
function getDayMutable(key){
  var dk = dayKeyOf(key);
  if (!blob.data[dk]) blob.data[dk] = { mainTasks: [] };
  return blob.data[dk];
}
function allDiaryKeys(){
  return Object.keys(blob.data).filter(function(k){ return k.indexOf('diary:')===0; }).map(function(k){ return k.slice(6); });
}
function computeRolloverDay(key){
  var target = parseDateKey(key);
  var bestKey=null, bestDate=null;
  allDiaryKeys().forEach(function(k){
    var d = parseDateKey(k);
    if (d < target && (!bestDate || d > bestDate)) { bestDate=d; bestKey=k; }
  });
  if (!bestKey) return null;
  var src = blob.data[dayKeyOf(bestKey)];
  var carried = [];
  src.mainTasks.forEach(function(t){
    if (!t.done){
      carried.push({
        id: genId(),
        text: t.text,
        done: false,
        label: t.label || null,
        priority: (t.priority===undefined?null:t.priority),
        reminderTime: null,
        tinyTasks: (t.tinyTasks||[]).map(function(tt){ return { id: genId(), text: tt.text, done: tt.done, priority: (tt.priority===undefined?null:tt.priority) }; }),
        moveHistory: (t.moveHistory||[]).slice()
      });
    }
  });
  if (carried.length===0) return null;
  return { mainTasks: carried };
}
/* Rollover only applies when opening the REAL today's date for the first time. */
function getOrCreateDayForView(key){
  var dk = dayKeyOf(key);
  if (blob.data[dk]) return blob.data[dk];
  if (key === dateKey(new Date())){
    var rolled = computeRolloverDay(key);
    if (rolled){
      blob.data[dk] = rolled;
      markDirty();
      return rolled;
    }
  }
  return { mainTasks: [] };
}
function findMain(mainId){
  var day = getDayMutable(dateKey(currentDate));
  return day.mainTasks.find(function(t){ return t.id===mainId; });
}
function findTiny(mainId, tinyId){
  var t = findMain(mainId);
  if (!t) return null;
  return (t.tinyTasks||[]).find(function(x){ return x.id===tinyId; });
}
function sortByPriority(arr){
  return arr.slice().sort(function(a,b){
    var ap=a.priority, bp=b.priority;
    if (ap!=null && bp!=null) return ap-bp;
    if (ap!=null) return -1;
    if (bp!=null) return 1;
    return 0;
  });
}

/* ================= mutations ================= */
function addMainTask(text){
  text = text.trim(); if (!text) return;
  var day = getDayMutable(dateKey(currentDate));
  day.mainTasks.push({ id: genId(), text: text, done:false, label:null, priority:null, reminderTime:null, tinyTasks:[], moveHistory:[] });
  markDirty(); renderTaskList();
}
function addTinyTask(mainId, text){
  text = text.trim(); if (!text) return;
  var t = findMain(mainId); if (!t) return;
  t.tinyTasks = t.tinyTasks||[];
  t.tinyTasks.push({ id: genId(), text: text, done:false, priority:null });
  markDirty(); renderTaskList();
}
function toggleMainDone(mainId, checked){
  var t = findMain(mainId); if (!t) return;
  t.done = checked; markDirty(); renderTaskList();
}
function toggleTinyDone(mainId, tinyId, checked){
  var tt = findTiny(mainId, tinyId); if (!tt) return;
  tt.done = checked; markDirty(); renderTaskList();
}
function editMainText(mainId, text){
  var t = findMain(mainId); if (!t) return;
  text = text.trim(); if (!text) text = t.text;
  if (t.text!==text){ t.text=text; markDirty(); }
}
function editTinyText(mainId, tinyId, text){
  var tt = findTiny(mainId, tinyId); if (!tt) return;
  text = text.trim(); if (!text) text = tt.text;
  if (tt.text!==text){ tt.text=text; markDirty(); }
}
function setMainLabel(mainId, label){
  var t = findMain(mainId); if (!t) return;
  t.label = label||null; markDirty(); renderTaskList(); renderLabelFilterOptions();
}
function addLabelToList(name){
  name = name.trim(); if (!name) return;
  var list = blob.data['labels:list'] = blob.data['labels:list']||[];
  if (list.indexOf(name)===-1){ list.push(name); markDirty(); }
}
function renameLabel(oldName, newName){
  newName = newName.trim(); if (!newName || newName===oldName) return;
  var list = blob.data['labels:list'] = blob.data['labels:list']||[];
  var idx = list.indexOf(oldName);
  if (idx>=0) list[idx]=newName; else list.push(newName);
  allDiaryKeys().forEach(function(k){
    blob.data[dayKeyOf(k)].mainTasks.forEach(function(t){ if (t.label===oldName) t.label=newName; });
  });
  markDirty();
}
function deleteLabel(name){
  var list = blob.data['labels:list'] = blob.data['labels:list']||[];
  var idx = list.indexOf(name);
  if (idx>=0) list.splice(idx,1);
  allDiaryKeys().forEach(function(k){
    blob.data[dayKeyOf(k)].mainTasks.forEach(function(t){ if (t.label===name) t.label=null; });
  });
  markDirty();
}
function setPriority(mainId, kind, tinyId, value){
  var t = findMain(mainId); if (!t) return;
  if (kind==='main') t.priority = value;
  else { var tt=findTiny(mainId,tinyId); if (tt) tt.priority=value; }
  markDirty(); renderTaskList();
}
function setReminder(mainId, value){
  var t = findMain(mainId); if (!t) return;
  t.reminderTime = value||null; markDirty(); renderTaskList();
}
function recordDeletedSnapshot(entry){
  var list = blob.data['history:deleted'] = blob.data['history:deleted']||[];
  list.unshift(entry); markDirty();
}
function deleteMain(mainId){
  var t = findMain(mainId); if (!t) return;
  if (!confirm('Delete "'+t.text+'"? This will be recorded in Deleted history.')) return;
  var day = getDayMutable(dateKey(currentDate));
  var idx = day.mainTasks.findIndex(function(x){ return x.id===mainId; });
  if (idx<0) return;
  recordDeletedSnapshot({
    type:'main', text:t.text, label:t.label,
    tinyTasks:(t.tinyTasks||[]).map(function(x){ return x.text; }),
    date: dateKey(currentDate), deletedAt: Date.now()
  });
  day.mainTasks.splice(idx,1);
  if (openTinyAddFor===mainId) openTinyAddFor=null;
  markDirty(); renderTaskList();
}
function deleteTiny(mainId, tinyId){
  var t = findMain(mainId); if (!t) return;
  var idx = (t.tinyTasks||[]).findIndex(function(x){ return x.id===tinyId; });
  if (idx<0) return;
  var tt = t.tinyTasks[idx];
  recordDeletedSnapshot({ type:'tiny', text:tt.text, parentText:t.text, date: dateKey(currentDate), deletedAt: Date.now() });
  t.tinyTasks.splice(idx,1);
  markDirty(); renderTaskList();
}
function moveMain(mainId, newDateKeyStr){
  if (!newDateKeyStr) return;
  var oldKey = dateKey(currentDate);
  if (newDateKeyStr===oldKey) return;
  var day = getDayMutable(oldKey);
  var idx = day.mainTasks.findIndex(function(x){ return x.id===mainId; });
  if (idx<0) return;
  var t = day.mainTasks[idx];
  day.mainTasks.splice(idx,1);
  t.moveHistory = t.moveHistory||[];
  t.moveHistory.push({ from: oldKey, to: newDateKeyStr, timestamp: Date.now() });
  var destDay = getDayMutable(newDateKeyStr);
  destDay.mainTasks.push(t);
  markDirty(); renderTaskList();
  toast('Moved to '+newDateKeyStr);
}

/* ================= search / history queries ================= */
function searchAll(query){
  query = query.toLowerCase().trim();
  if (!query) return [];
  var results = [];
  allDiaryKeys().forEach(function(k){
    var day = blob.data[dayKeyOf(k)];
    day.mainTasks.forEach(function(t){
      if (t.text.toLowerCase().indexOf(query)>=0) results.push({date:k, type:'main', text:t.text});
      (t.tinyTasks||[]).forEach(function(tt){
        if (tt.text.toLowerCase().indexOf(query)>=0) results.push({date:k, type:'tiny', text:tt.text, parent:t.text});
      });
    });
  });
  results.sort(function(a,b){ return b.date.localeCompare(a.date); });
  return results;
}
function getCompletedAll(){
  var results = [];
  allDiaryKeys().forEach(function(k){
    blob.data[dayKeyOf(k)].mainTasks.forEach(function(t){
      if (t.done) results.push({ date:k, text:t.text, label:t.label });
    });
  });
  results.sort(function(a,b){ return b.date.localeCompare(a.date); });
  return results;
}

/* ================= toast ================= */
function toast(msg, ms){
  ms = ms||3000;
  var c = document.getElementById('toastContainer');
  var el = document.createElement('div');
  el.className='toast'; el.textContent = msg;
  c.appendChild(el);
  requestAnimationFrame(function(){ el.classList.add('show'); });
  setTimeout(function(){ el.classList.remove('show'); setTimeout(function(){ el.remove(); }, 300); }, ms);
}

var recognition = null;
var SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;

  recognition = new SpeechRec();

  recognition.interimResults = false;

    var transcript = e.results[0][0].transcript;

  recognition.onend = function(){ micBtn.classList.remove('listening'); };

function handleInputSubmit(text){

}

  try{ recognition.start(); micBtn.classList.add('listening'); }catch(e){}

taskListEl.addEventListener('click', function(e){
  var mainEl = e.target.closest('.main-task'); if (!mainEl) return;
  var mainId = mainEl.getAttribute('data-id');
  if (e.target.closest('.tag-btn')) openLabelPicker(mainId);
  else if (e.target.closest('.tt-pri-btn')){
    var tinyEl = e.target.closest('.tiny-task');
    openPriorityPicker(mainId, 'tiny', tinyEl.getAttribute('data-id'));
  }
  else if (e.target.closest('.pri-btn')) openPriorityPicker(mainId, 'main', null);
  else if (e.target.closest('.rem-btn')) openReminderPicker(mainId);
  else if (e.target.closest('.move-btn')) openMovePicker(mainId);
  else if (e.target.closest('.hist-btn')) openMoveHistory(mainId);
  else if (e.target.closest('.add-tiny-btn')){
    openTinyAddFor = (openTinyAddFor===mainId) ? null : mainId;
    textInput.placeholder = openTinyAddFor ? 'Add tiny task…' : 'Add a task or tap mic…';
    renderTaskList();
    textInput.focus();
  }
  else if (e.target.closest('.cancel-tiny-add')){
    openTinyAddFor = null; textInput.placeholder='Add a task or tap mic…'; renderTaskList();
  }
  else if (e.target.closest('.tt-del-btn')){
    var tinyEl2 = e.target.closest('.tiny-task');
    deleteTiny(mainId, tinyEl2.getAttribute('data-id'));
  }
  else if (e.target.closest('.del-btn')) deleteMain(mainId);

  var mainId = mainEl.getAttribute('data-id');

    toggleTinyDone(mainId, tinyEl.getAttribute('data-id'), e.target.checked);
  }
});
taskListEl.addEventListener('focusout', function(e){
  var mainEl = e.target.closest('.main-task'); if (!mainEl) return;
  var mainId = mainEl.getAttribute('data-id');
  if (e.target.classList.contains('mt-text')) editMainText(mainId, e.target.textContent);
  else if (e.target.classList.contains('tt-text')){
    var tinyEl = e.target.closest('.tiny-task');
    editTinyText(mainId, tinyEl.getAttribute('data-id'), e.target.textContent);

taskListEl.addEventListener('keydown', function(e){

/* ================= reminders ================= */
function checkReminders(){
  var now = new Date();
  var nowHM = pad2(now.getHours())+':'+pad2(now.getMinutes());
  var todayKeyStr = dateKey(now);
  var day = blob.data[dayKeyOf(todayKeyStr)];
  if (!day) return;
  day.mainTasks.forEach(function(t){
    if (t.reminderTime && !t.done && t.reminderTime===nowHM){
      var fireKey = todayKeyStr+'-'+t.id+'-'+t.reminderTime;
      if (!firedReminders.has(fireKey)){ firedReminders.add(fireKey); fireReminder(t); }
    }
  });
}
function fireReminder(t){
  toast('⏰ Reminder: '+t.text, 6000);
  if (navigator.vibrate) navigator.vibrate([200,100,200]);
  if (window.Notification && Notification.permission==='granted'){
    try{ new Notification('Diary To-Do Reminder', { body: t.text }); }catch(e){}
  }
}
setInterval(checkReminders, 15000);

/* ================= self-hosted sync (own PC via Tailscale) ================= */
function getServerUrl(){
  var u = (localStorage.getItem(K.serverUrl)||'').trim();
  return u ? u.replace(/\/+$/,'') : null;
}
function getSecretKey(){
  var k = (localStorage.getItem(K.secretKey)||'').trim();
  return k || null;
}
function isConfigured(){ return !!(getServerUrl() && getSecretKey()); }
function serverFetch(path, opts){
  opts = opts || {};
  var url = getServerUrl(), key = getSecretKey();
  if (!url || !key) return Promise.reject(new Error('NOT_CONFIGURED'));
  var headers = Object.assign({}, opts.headers||{}, { 'X-Sync-Key': key });
  return fetch(url + path, Object.assign({}, opts, { headers: headers })).then(function(res){
    if (res.status===401 || res.status===403){
      syncBroken = true; renderSyncStatus(); updateSetupStatus();
      throw new Error('AUTH_REQUIRED');
    }
    return res;
  });
}
function doPush(keepalive){
  return serverFetch('/sync', {
    method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(blob), keepalive: !!keepalive
  }).then(function(res){
    if (!res.ok) throw new Error('PUSH_FAILED');
    dirty = false;
    syncBroken = false;
    setSyncStatus('Synced '+new Date().toLocaleTimeString());
    updateSetupStatus();
  });
}
function doPull(){
  if (dirty) return doPush(false);
  return serverFetch('/sync', { method:'GET' }).then(function(res){
    if (!res.ok) throw new Error('PULL_FAILED');
    return res.json();
  }).then(function(remote){
    syncBroken = false;
    updateSetupStatus();
    if (!remote || typeof remote.updatedAt!=='number') return;
    if (remote.updatedAt > blob.updatedAt){
      blob = remote;
      persistLocalCache();
      renderAll();
      setSyncStatus('Synced '+new Date().toLocaleTimeString());
    } else if (blob.updatedAt > remote.updatedAt){
      /* local has a genuinely newer edit (e.g. dirty flag reset on reload) — must push it, not just sit on it */
      return doPush(false);
    } else {
      setSyncStatus('Up to date');
    }
  });
}
function enqueue(fn){
  var run = function(){ return fn().catch(function(err){
    if (err.message==='AUTH_REQUIRED') return;
    if (err.message==='NOT_CONFIGURED') return;
    /* transient failure (PC off, Tailscale down, network hiccup) — quietly retry on the next cycle */
    syncBroken = true; renderSyncStatus(); updateSetupStatus();
  }); };
  syncQueue = syncQueue.then(run, run);
  return syncQueue;
}
function pushNow(){
  if (!isConfigured()) return Promise.resolve();
  return enqueue(function(){ return doPush(false); });
}
function pullNow(){
  if (!isConfigured()) return Promise.resolve();
  return enqueue(function(){ return doPull(); });
}
function flushImmediate(){
  clearTimeout(pushTimer);
  if (dirty && isConfigured()) enqueue(function(){ return doPush(true); });
}
document.addEventListener('visibilitychange', function(){
  if (document.hidden) flushImmediate();
  else if (isConfigured()) pullNow();
});
window.addEventListener('pagehide', flushImmediate);
function startPeriodicSync(){
  setInterval(function(){ if (!document.hidden && isConfigured()) pullNow(); }, 20000);
}

/* ================= setup panel ================= */
var setupOverlay=document.getElementById('setupOverlay');
function openSetupPanel(){
  document.getElementById('setupServerUrlInput').value = localStorage.getItem(K.serverUrl)||'';
  document.getElementById('setupSecretKeyInput').value = localStorage.getItem(K.secretKey)||'';
  updateSetupStatus();
  setupOverlay.classList.add('open');
}
function closeSetupPanel(){ setupOverlay.classList.remove('open'); }
function updateSetupStatus(){
  var el = document.getElementById('setupStatusLine');
  if (!isConfigured()) el.textContent = 'Not connected yet.';
  else if (syncBroken) el.textContent = 'Can\'t reach the sync server right now (check the PC is on and Tailscale is connected).';
  else el.textContent = 'Connected to your sync server.';
}
document.getElementById('setupOpenBtn').onclick = openSetupPanel;
document.getElementById('setupCloseBtn').onclick = closeSetupPanel;
setupOverlay.addEventListener('click', function(e){ if (e.target===setupOverlay) closeSetupPanel(); });
document.getElementById('setupSaveBtn').onclick = function(){
  var url = document.getElementById('setupServerUrlInput').value.trim();
  var key = document.getElementById('setupSecretKeyInput').value.trim();
  if (!url || !key){ toast('Enter both the server URL and the secret key'); return; }
  localStorage.setItem(K.serverUrl, url);
  localStorage.setItem(K.secretKey, key);
  syncBroken = false;
  renderSyncStatus(); updateSetupStatus();
  toast('Saved — connecting…');
  pullNow().then(function(){ startPeriodicSync(); updateSetupStatus(); });
};
document.getElementById('setupSyncNowBtn').onclick = function(){ toast('Syncing…'); pullNow().then(updateSetupStatus); };
document.getElementById('setupDisconnectBtn').onclick = function(){
  localStorage.removeItem(K.serverUrl);
  localStorage.removeItem(K.secretKey);
  syncBroken = false;
  renderSyncStatus(); updateSetupStatus();
  toast('Disconnected from sync server');
};

/* ================= init ================= */
function init(){
  renderAll();
  if (isConfigured()){ pullNow(); startPeriodicSync(); }
}
if (document.readyState==='loading') document.addEventListener('DOMContentLoaded', init);
else init();

})();
</script>
